<script>
const $=id=>document.getElementById(id);
const STORE='forsaken_caos_v1';
let character={}, messages=[], sceneStarted=false, turn=0;
function loadData(){try{return JSON.parse(localStorage.getItem(STORE))||{character:null,stories:[]}}catch(e){return {character:null,stories:[]}}}
let data=loadData();
function persist(){localStorage.setItem(STORE,JSON.stringify(data))}
function getCharacter(){return {name:$('charName').value.trim()||'Sin nombre',role:$('charRole').value,emoji:$('charEmoji').value,color:$('charColor').value,ability:$('charAbility').value.trim()||'Sin habilidad definida',personality:$('charPersonality').value.trim(),backstory:$('charBackstory').value.trim(),look:$('charLook').value.trim()}}
function fillCharacter(c){if(!c)return;$('charName').value=c.name||'';$('charRole').value=c.role||'Superviviente';$('charEmoji').value=c.emoji||'🕷️';$('charColor').value=c.color||'#9b6dff';$('charAbility').value=c.ability||'';$('charPersonality').value=c.personality||'';$('charBackstory').value=c.backstory||'';$('charLook').value=c.look||'';preview()}
function preview(){const c=getCharacter();$('avatarPreview').textContent=c.emoji;$('avatarPreview').style.borderColor=c.color;$('previewName').textContent=c.name;$('previewRole').textContent=c.role;$('previewName').style.color=c.color}
['charName','charRole','charEmoji','charColor','charAbility','charPersonality','charBackstory','charLook'].forEach(id=>$(id).addEventListener('input',preview));
$('setting').addEventListener('change',()=> $('customWrap').classList.toggle('hidden',$('setting').value!=='Mapa personalizado'));
function switchTab(tab){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===tab));if(tab==='saved')renderStories()}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));
$('saveCharacter').onclick=()=>{data.character=getCharacter();persist();$('saveCharacter').textContent='¡Guardado!';setTimeout(()=>$('saveCharacter').textContent='Guardar personaje',1200)};
$('resetCharacter').onclick=()=>{fillCharacter({name:'',role:'Superviviente',emoji:'🕷️',color:'#9b6dff',ability:'',personality:'',backstory:'',look:''})};
function addBubble(who,txt){const b=document.createElement('div');b.className='bubble '+(who==='Tú'?'user':'ai');const name=document.createElement('span');name.className='who';name.textContent=who;b.appendChild(name);b.appendChild(document.createTextNode(txt));$('chatlog').appendChild(b);$('chatlog').scrollTop=$('chatlog').scrollHeight;messages.push({who,text:txt})}
function sceneName(){return $('setting').value==='Mapa personalizado'?($('customSetting').value.trim()||'un lugar desconocido'):$('setting').value}
function startScene(){character=getCharacter();data.character=character;persist();messages=[];turn=0;sceneStarted=true;$('chatlog').innerHTML='';$('sceneBadge').textContent=$('mode').value==='game'?'MODO JUEGO':'ROLEPLAY';const setting=sceneName();const openings={
tension:`Una luz roja parpadea sobre la puerta de ${setting}. El silencio se rompe con tres golpes desde el otro lado. En una pantalla aparece tu nombre: ${character.name}. Una voz distorsionada susurra: «Sabemos que despertaste».`,
action:`La alarma estalla en ${setting}. Las luces se apagan una tras otra y pasos rápidos resuenan detrás de ti. Una puerta de emergencia está a pocos metros; al fondo, algo se mueve demasiado deprisa.`,
drama:`En el centro de ${setting} encuentras una fotografía vieja. Alguien ha tachado todos los rostros menos el tuyo, ${character.name}. En el reverso hay una frase escrita con tu letra: «No confíes en lo que recuerdas».`,
chaos:`Las luces de ${setting} parpadean como si el edificio tuviera hipo. Un altavoz anuncia: «¡Bienvenido al turno de noche! La salida está… probablemente por ahí». Una silueta saluda desde el pasillo y desaparece al instante.`};
addBubble('Narrador',openings[$('tone').value]);if(character.backstory)addBubble('Sistema','Tu pasado pesa sobre la escena: '+character.backstory);if($('mode').value==='game')showChoices();else $('choices').classList.add('hidden')}
$('startScene').onclick=()=>{switchTab('rp');startScene()};
function replyFor(text){const t=text.toLowerCase();const c=character;turn++;let base;
if(/ataco|golpe|pego|disparo|lanzo|atacar/.test(t))base=`Tu movimiento corta el silencio. La figura retrocede, pero el ruido atrae algo desde otra habitación. ${c.ability?`Tu habilidad, «${c.ability}», podría cambiar el rumbo si decides usarla.`:''}`;
else if(/corro|huir|escapo|escondo|me escond/.test(t))base=`Te mueves antes de que la presencia pueda reaccionar. Encuentras un rincón oscuro y escuchas pasos que pasan de largo… aunque una sombra se queda quieta al otro lado de la pared.`;
else if(/hablo|digo|pregunto|grito|respondo/.test(t))base=`Tu voz rebota por el pasillo. Durante un instante no ocurre nada. Después, el altavoz responde con una frase que parece conocer demasiado de ti: «¿De verdad quieres saberlo?»`;
else if(/miro|observo|examino|busco|reviso/.test(t))base=`Examinas el entorno con cuidado. Detrás de una placa suelta descubres una marca reciente y un pequeño símbolo que coincide con algo de tu pasado. No estás aquí por accidente.`;
else if(/habilidad|poder|sombra/.test(t))base=`El aire se deforma alrededor de ti. Tu habilidad, «${c.ability}», deja una estela breve y revela una ruta que antes no podías ver. Pero algo al fondo también te ha visto.`;
else base=`${c.name} da forma a la situación con su propia decisión. El lugar parece reaccionar a cada movimiento: una luz se enciende al fondo y una puerta que estaba cerrada queda entreabierta. Desde el otro lado llega un susurro: «Te toca elegir».`;
if(turn%4===0)base+=` Una sirena suena a lo lejos. La escena cambia: ahora tienes menos tiempo para decidir qué hacer.`;
return base}
$('chatForm').addEventListener('submit',e=>{e.preventDefault();const text=$('message').value.trim();if(!text)return;if(!sceneStarted)startScene();addBubble(character.name||'Tú',text);$('message').value='';addBubble('Narrador',replyFor(text));if($('mode').value==='game')showChoices()});
function showChoices(){const c=$('choices');c.classList.remove('hidden');c.innerHTML='';const opts=[['Investigar el ruido','Te acercas con cuidado para descubrir qué hay detrás.'],['Buscar una salida','Sigues las señales de emergencia hacia una posible salida.'],['Usar tu habilidad','Pones a prueba tu poder antes de avanzar.']];opts.forEach(([title,desc])=>{const b=document.createElement('button');b.className='choice';b.innerHTML='';const strong=document.createElement('strong');strong.textContent=title;const span=document.createElement('span');span.textContent=desc;b.append(strong,span);b.onclick=()=>{addBubble(character.name,title+'.');addBubble('Narrador',desc+' El entorno responde de forma inesperada. Un nuevo sonido surge a tus espaldas. ¿Qué harás ahora?');turn++;showChoices()};c.appendChild(b)})}
function saveStory(){if(!messages.length){alert('Empieza una escena antes de guardarla.');return}const title=prompt('Nombre para esta historia:',`${character.name||'Historia'} — ${sceneName()}`);if(title===null)return;data.stories.unshift({id:Date.now(),title:title.trim()||'Historia sin título',character:getCharacter(),mode:$('mode').value,setting:sceneName(),tone:$('tone').value,messages:[...messages],saved:new Date().toLocaleString()});persist();alert('Historia guardada en este dispositivo.');renderStories()}
$('saveStory').onclick=saveStory;
$('clearChat').onclick=()=>{if(confirm('¿Empezar una escena nueva? La historia actual seguirá guardada solo si ya la guardaste.')){messages=[];sceneStarted=false;turn=0;$('chatlog').innerHTML='<div class="bubble ai"><span class="who">Sistema</span>Escena lista para empezar. Pulsa «Comenzar historia».</div>';$('choices').classList.add('hidden');$('sceneBadge').textContent='EN ESPERA'}};
function renderStories(){const list=$('storyList');list.innerHTML='';if(!data.stories.length){list.innerHTML='<p class="muted">Todavía no hay historias. ¡La primera aventura te espera!</p>';return}data.stories.forEach(s=>{const item=document.createElement('div');item.className='storyitem';const left=document.createElement('div');const strong=document.createElement('strong');strong.textContent=s.title;const small=document.createElement('div');small.className='small';small.textContent=`${s.character?.name||'Personaje'} • ${s.messages.length} mensajes • ${s.saved}`;left.append(strong,small);const right=document.createElement('div');right.className='row wrap';const open=document.createElement('button');open.textContent='Abrir';open.onclick=()=>loadStory(s.id);const del=document.createElement('button');del.textContent='Borrar';del.onclick=()=>{if(confirm('¿Borrar esta historia?')){data.stories=data.stories.filter(x=>x.id!==s.id);persist();renderStories()}};right.append(open,del);item.append(left,right);list.append(item)})}
function loadStory(id){const s=data.stories.find(x=>x.id===id);if(!s)return;fillCharacter(s.character);character=s.character;messages=[];turn=0;sceneStarted=true;$('mode').value=s.mode;$('tone').value=s.tone;$('setting').value=['Hospital abandonado','Centro comercial a oscuras','Estación subterránea','Laboratorio sellado','Ciudad bajo la niebla','Mapa personalizado'].includes(s.setting)?s.setting:'Mapa personalizado';if($('setting').value==='Mapa personalizado')$('customSetting').value=s.setting;$('customWrap').classList.toggle('hidden',$('setting').value!=='Mapa personalizado');$('chatlog').innerHTML='';s.messages.forEach(m=>addBubble(m.who,m.text));$('sceneBadge').textContent='HISTORIA CARGADA';if(s.mode==='game')showChoices();else $('choices').classList.add('hidden');switchTab('rp')}
$('exportAll').onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='mis-historias-forsaken.json';a.click();URL.revokeObjectURL(url)};
if(data.character)fillCharacter(data.character);else preview();renderStories();

};
let lobbyInterval=null, lobbySeconds=180, roundActive=false, roundTurn=0;
function mmss(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function roundLog(who,text){const log=$('roundLog');const b=document.createElement('div');b.className='bubble '+(who==='Tú'?'user':'ai');const w=document.createElement('span');w.className='who';w.textContent=who;b.appendChild(w);b.appendChild(document.createTextNode(text));log.appendChild(b);log.scrollTop=log.scrollHeight}
function currentRoundCharacter(){const c=getCharacter();return c.name?c:{name:'Noob',role:'Superviviente',emoji:'🙂',ability:'Improvisación',personality:'Ingenioso',look:'Ropa clásica'}}
function updateAbilityCards(){
 const side=$('roundSide').value, selected=side==='killer'?$('roundKiller').value:$('roundSurvivor').value;
 const dataChar=roster[selected];const cards=$('abilityCards');cards.innerHTML='';
 const list=[{name:selected,ability:dataChar?.ability||'Improvisación',desc:dataChar?.desc||'Tu personaje adapta su estrategia a la situación.'}];
 if(side==='survivor'){const c=currentRoundCharacter();if(c.name && c.name!=='Noob')list.unshift({name:c.name,ability:c.ability,desc:(c.personality||'Tu habilidad personalizada')+' '+(c.look||'')})}
 list.forEach(x=>{const box=document.createElement('div');box.className='card';box.style.padding='12px';const h=document.createElement('h3');h.textContent=x.name+' — '+x.ability;const p=document.createElement('p');p.className='muted';p.style.margin='0';p.textContent=x.desc;box.append(h,p);cards.append(box)})
}
function beginRound(fromClock=false){
 if(lobbyInterval){clearInterval(lobbyInterval);lobbyInterval=null}
 roundActive=true;roundTurn=0;
 const map=$('roundMap').value, killer=$('roundKiller').value, side=$('roundSide').value;
 const custom=currentRoundCharacter();
 const player=side==='killer'?killer:(custom.name||$('roundSurvivor').value);
 $('activeMap').textContent=map;$('activePlayer').textContent=player;$('activeKiller').textContent=killer;
 $('roundBadge').textContent=side==='killer'?'JUEGAS COMO ASESINO':'JUEGAS COMO SUPERVIVIENTE';
 $('lobbyStatus').textContent='¡La casa tiembla! La ronda ha comenzado.';
 $('lobbyHint').textContent='El reloj se detuvo. Sobrevive o caza.';
 $('countdown').textContent='00:00';$('enterLobby').disabled=true;
 $('roundLog').innerHTML='';
 roundLog('Sistema',`¡RONDA INICIADA! ${fromClock?'El reloj llegó a cero.':'Has iniciado la ronda manualmente.'} El grupo aparece en ${map}. ${mapDescriptions[map]||''}`);
 if(side==='survivor')roundLog('Narrador',`Tu personaje ${player} está junto a ${$('roundSurvivor').value}. El asesino es ${killer}. Encuentra una ruta, usa tus habilidades y coopera para sobrevivir.`);
 else roundLog('Narrador',`Tú controlas a ${killer}. Los supervivientes están dispersos por ${map}. Usa tu habilidad y el entorno para presionarlos antes de que consigan escapar.`);
 updateAbilityCards();
}
function startLobby(){
 if(lobbyInterval)clearInterval(lobbyInterval);
 lobbySeconds=180;roundActive=false;$('countdown').textContent='03:00';$('enterLobby').disabled=true;
 $('lobbyStatus').textContent='Esperando en la casa…';$('lobbyHint').textContent='La ronda comienza automáticamente al llegar a 00:00.';
 $('roundBadge').textContent='EN ESPERA';$('roundLog').innerHTML='';roundLog('Narrador','Llegas a una casa antigua. Hay varias personas esperando en la sala. Un reloj enorme marca 03:00. Nadie sabe qué hay detrás de la puerta principal.');
 roundLog('Sistema','Puedes explorar, ajustar el mapa o esperar. Cuando el reloj llegue a cero, entrarás automáticamente en la ronda.');
 lobbyInterval=setInterval(()=>{lobbySeconds=Math.max(0,lobbySeconds-1);$('countdown').textContent=mmss(lobbySeconds);if(typeof refreshSpectre==='function')refreshSpectre();if(lobbySeconds===120)$('lobbyStatus').textContent='Se oyen pasos en el piso de arriba…';if(lobbySeconds===60)$('lobbyStatus').textContent='Las luces empiezan a parpadear…';if(lobbySeconds===30)$('lobbyStatus').textContent='¡La casa está temblando!';if(lobbySeconds===0)beginRound(true)},1000);
}

$('resetLobby').addEventListener('click',()=>{if(lobbyInterval)clearInterval(lobbyInterval);lobbyInterval=null;lobbySeconds=180;roundActive=false;$('countdown').textContent='03:00';$('lobbyStatus').textContent='La casa está en silencio…';$('lobbyHint').textContent='Pulsa «Entrar en la casa» para iniciar la espera.';$('enterLobby').disabled=false;$('roundBadge').textContent='SIN COMENZAR'});
$('startRoundNow').addEventListener('click',()=>{switchTab('round');beginRound(false)});
$('roundSide').addEventListener('change',()=>{if($('roundSide').value==='killer')$('roundKiller').value=$('roundKiller').value;updateAbilityCards()});
$('roundKiller').addEventListener('change',updateAbilityCards);
$('roundSurvivor').addEventListener('change',updateAbilityCards);
$('doRoundAction').addEventListener('click',()=>{
 const action=$('roundAction').value.trim();if(!action){$('roundAction').focus();return}
 if(!roundActive){roundLog('Sistema','Todavía estás en la casa. Entra en la casa para iniciar el reloj o comienza una ronda ahora.');return}
 roundTurn++;roundLog('Tú',action);$('roundAction').value='';
 const side=$('roundSide').value, who=side==='killer'?$('roundKiller').value:(currentRoundCharacter().name||$('roundSurvivor').value);
 let response;
 if(/habilidad|poder|usar|activo/i.test(action))response=`${who} activa su recurso especial. ${roster[who]?.desc||'Tu habilidad personalizada altera el ritmo de la escena.'} El entorno reacciona y aparece una nueva oportunidad.`;
 else if(/correr|huir|escapar|escond/i.test(action))response='Te mueves con rapidez entre los obstáculos. Escuchas pasos acercándose, pero consigues llegar a una bifurcación: un camino tiene luz y el otro parece más seguro.';
 else if(/buscar|mirar|examinar|pista/i.test(action))response=`Encuentras señales recientes en ${$('roundMap').value}: marcas en el suelo y una puerta entreabierta. Podrían guiarte hacia una salida o llevarte directo a una emboscada.`;
 else if(side==='killer')response=`${who} responde a tu acción y cambia de estrategia. Una presencia cruza el pasillo y los supervivientes empiezan a separarse. La presión aumenta.`;
 else response=`La escena avanza en ${$('roundMap').value}. ${$('roundKiller').value} aparece al fondo, pero tu compañero también ha visto algo importante. Tienes un instante para decidir tu siguiente movimiento.`;
 if(roundTurn%4===0)response+=' El reloj de la ronda avanza y la tensión aumenta. No te quedes quieto demasiado tiempo.';
 roundLog('Narrador',response);
});
$('roundChoice').addEventListener('click',()=>{$('roundAction').value='Busco pistas y reviso los alrededores con cuidado.';$('doRoundAction').click()});
$('rosterPick').innerHTML=Object.keys(roster).map(n=>`<option>${n}</option>`).join('');
function showRoster(){const name=$('rosterPick').value, c=roster[name];$('rosterDetails').innerHTML='';const strong=document.createElement('strong');strong.textContent=name+' · '+c.side+' · '+c.role;const p=document.createElement('p');p.style.margin='6px 0 0';p.textContent=c.ability+': '+c.desc;$('rosterDetails').append(strong,p)}
$('rosterPick').addEventListener('change',showRoster);
$('roundSide').addEventListener('change',()=>{if($('roundSide').value==='killer')$('roundKiller').value=$('roundKiller').value;updateAbilityCards()});
const oldPreview=preview;
preview=function(){oldPreview();if($('abilityCards'))updateAbilityCards()};
showRoster();updateAbilityCards();


// --- Spectre: autoridad total dentro de la simulación local ---
const spectreLines = [];
function spectreSay(message, who='Spectre'){
 const box=$('spectreVision'); if(!box)return;
 const b=document.createElement('div');b.className='bubble ai';
 const w=document.createElement('span');w.className='who';w.textContent=who;b.append(w,document.createTextNode(message));box.appendChild(b);box.scrollTop=box.scrollHeight;
}
function refreshSpectre(){
 if(!$('spectreRoundState'))return;
 $('spectreRoundState').textContent=roundActive?'RONDA ACTIVA':'EN ESPERA';
 $('spectreClock').textContent=$('countdown')?.textContent||mmss(lobbySeconds);
 $('spectreMap').value=$('roundMap')?.value||$('spectreMap').value;
 $('spectreRoster').textContent=roundActive
  ? `El Spectre ve a todos. Mapa: ${$('roundMap').value}. Asesino: ${$('roundKiller').value}. Superviviente seleccionado: ${$('roundSurvivor').value}. Turno: ${roundTurn}. Estado: ${roundActive?'activo':'en espera'}.`
  : 'Todos los personajes están localizados en la casa de espera. El Spectre puede cambiar las reglas antes del inicio.';
}

function socialChoice(name,seed=0,context=''){
 const c=socialCast[name]||socialCast['Noob'];
 const lower=String(context||'').toLowerCase();
 // Reactions follow character role and context; no automatic romance or flattery.
 if(/amor|enamor|novi[oa]|besa|cita|guap[oa]|te amo|me gustas/.test(lower)){
  const boundary={
   'Noob':'¿Eh? No sé qué responder a eso. Tenemos problemas más urgentes.',
   'Elliot':'Prefiero conocerte mejor antes de hablar de algo así.',
   'Shedletsky':'No confundas una conversación con una invitación.',
   'Guest 1337':'Mantengamos el enfoque. No es el momento.',
   '007n7':'Eso no cambia mis prioridades. Y no esperes una respuesta personal.',
   'Two Time':'No voy a fingir una cercanía que no existe.',
   'Chance':'Vaya giro. No voy a apostar sobre eso ahora.',
   'Builderman':'Ahora mismo tengo cosas más importantes que resolver.',
   'Taph':'Voy a dejar esa pregunta sin registrar.',
   'Dusekkar':'No confundas curiosidad con un vínculo.',
   'Jane Doe':'No me conoces lo suficiente para asumir eso.',
   'Veeronica':'¿Ya estamos en esa parte de la conversación? Ni siquiera te conozco.',
   'c00lkidd':'JAJAJA, ¿qué? ¡Estoy aquí para perseguirte, no para eso!',
   'Slasher':'No.',
   'John Doe':'SOLICITUD RECHAZADA.',
   'Noli':'Qué intento tan predecible de distraerme.',
   '1x1x1x1':'VÍNCULO EMOCIONAL: IRRELEVANTE.',
   'Guest 666':'Deja de hablar.',
   'Nosferatu':'La familiaridad debe ganarse, mortal.',
   'Azure':'No confundas mi presencia con interés.',
   'Spectre':'No confundas vigilancia con afecto.'
  };
  return boundary[name]||'No voy a fingir sentimientos por alguien que apenas conozco.';
 }
 if(/ayuda|ayúdame|auxilio|herid|miedo|asustad|peligro/.test(lower)){
  if(c.role==='killer') return c.voice[(Math.abs(seed)+1)%c.voice.length];
  const support={
   'Noob':'Vale, respira. Vamos a pensar en una salida juntos.',
   'Elliot':'Dime dónde estás y qué necesitas. Intentaré ayudarte.',
   'Guest 1337':'Indica tu ubicación. Voy a cubrir la ruta.',
   'Builderman':'Busca un lugar seguro; revisaré una salida.',
   'Jane Doe':'Dame los hechos. Encontraremos una solución.',
   'Dusekkar':'Mantén la calma y no sigas cualquier voz que escuches.'
  };
  return support[name]||c.voice[Math.abs(seed)%c.voice.length];
 }
 if(/amenaz|matar|atrap|te voy a|voy a destruir/.test(lower) && c.role==='killer') return c.voice[(Math.abs(seed)+2)%c.voice.length];
 return c.voice[Math.abs(seed)%c.voice.length];
}
function makeSocialPost(author,text,image='',app='Feed',isReply=false){
 return {id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),author,text,image,app,time:new Date().toLocaleString(),comments:[],isReply};
}
function renderFeed(){
 const feed=$('socialFeed');if(!feed)return;feed.innerHTML='';
 $('feedCount').textContent=`${socialPosts.length} publicación${socialPosts.length===1?'':'es'}`;
 if(!socialPosts.length){feed.innerHTML='<div class="notice">Todavía no hay publicaciones. ¡Que alguien rompa el silencio!</div>';return}
 [...socialPosts].reverse().forEach(post=>{
  const card=document.createElement('div');card.className='card';card.style.padding='13px';
  const head=document.createElement('div');head.className='row';head.style.justifyContent='space-between';
  const author=document.createElement('strong');author.textContent=`${socialCast[post.author]?.emoji||'📱'} ${post.author}`;
  const meta=document.createElement('span');meta.className='small';meta.textContent=`${post.app} · ${post.time}`;head.append(author,meta);card.append(head);
  const body=document.createElement('p');body.style.whiteSpace='pre-wrap';body.style.overflowWrap='anywhere';body.textContent=post.text||'';card.append(body);
  if(post.image){const img=document.createElement('img');img.src=post.image;img.alt='Imagen publicada por '+post.author;img.style.cssText='display:block;max-width:100%;max-height:300px;object-fit:contain;border-radius:12px;border:1px solid var(--line);margin:8px 0';card.append(img)}
  const comments=document.createElement('div');comments.style.cssText='border-top:1px solid var(--line);padding-top:9px;margin-top:9px';
  (post.comments||[]).forEach(c=>{const line=document.createElement('p');line.style.cssText='margin:7px 0;font-size:13px;white-space:pre-wrap';line.textContent=`${socialCast[c.author]?.emoji||'💬'} ${c.author}: ${c.text}`;comments.append(line)});
  const form=document.createElement('div');form.className='composer';
  const input=document.createElement('textarea');input.placeholder='Comentar o responder…';input.maxLength=300;input.setAttribute('aria-label','Comentario para '+post.author);input.style.minHeight='42px';
  const btn=document.createElement('button');btn.textContent='Responder';
  btn.addEventListener('click',()=>{
   const val=input.value.trim();if(!val)return;
   const replyAuthor=$('postAuthor').value||'Noob';post.comments=post.comments||[];post.comments.push({author:replyAuthor,text:val});
   // One or two characters reply in their own style.
   const possible=socialNames.filter(n=>n!==replyAuthor && n!==post.author);
   const chosen=possible[(post.comments.length+post.author.length)%possible.length];
   post.comments.push({author:chosen,text:socialChoice(chosen,post.comments.length+post.text.length, val+' '+post.text)});
   socialSave();renderFeed();
  });
  form.append(input,btn);comments.append(form);
  const actions=document.createElement('div');actions.className='actions';
  const like=document.createElement('button');like.textContent='♥ Reaccionar';like.addEventListener('click',()=>{post.comments=post.comments||[];post.comments.push({author:'Spectre',text:'♥ El Spectre ha registrado esta reacción.'});socialSave();renderFeed()});
  const replyAI=document.createElement('button');replyAI.textContent='Que respondan';replyAI.addEventListener('click',()=>{const chosen=socialNames.filter(n=>n!==post.author)[(post.comments.length+post.author.length)%socialNames.filter(n=>n!==post.author).length];post.comments=post.comments||[];post.comments.push({author:chosen,text:socialChoice(chosen,post.comments.length+post.text.length, val+' '+post.text)});socialSave();renderFeed()});
  actions.append(like,replyAI);comments.append(actions);card.append(comments);feed.append(card);
 });
}

function getCharacterState(name){
 if(!characterStates[name])characterStates[name]={anger:0,fear:0,trust:0,lastMood:'Neutral'};
 return characterStates[name];
}
function moodLabel(st){
 if(st.anger>=5)return 'ENFADADO/A';
 if(st.fear>=5)return 'ATERRORIZADO/A';
 if(st.trust>=4 && st.anger<3)return 'CONFIADO/A';
 if(st.fear>=3)return 'ASUSTADO/A';
 if(st.anger>=3)return 'MOLESTO/A';
 if(st.trust>=2)return 'MÁS TRANQUILO/A';
 return 'NEUTRAL';
}
function updateMoodUI(){
 const name=$('chatCharacter').value,st=getCharacterState(name);
 if($('characterMood'))$('characterMood').textContent=moodLabel(st);
 if($('characterAffinity'))$('characterAffinity').textContent=`${st.trust} confianza`;
 if($('characterMoodNote'))$('characterMoodNote').textContent=`Enojo: ${st.anger}/8 · Miedo: ${st.fear}/8 · Confianza: ${st.trust}/8. La reacción depende de lo que hagas y de quién sea el personaje.`;
}
function renderCharacterChat(){
 const name=$('chatCharacter').value,box=$('characterChat');if(!box)return;box.innerHTML='';
 const history=characterChats[name]||[];
 if(!history.length){const d=document.createElement('div');d.className='bubble ai';d.textContent=`${name} está aquí. Sus emociones cambiarán según cómo lo trates y lo que ocurra.`;box.append(d);updateMoodUI();return}
 history.forEach(m=>{
  const d=document.createElement('div');d.className='bubble '+(m.from==='you'?'user':'ai');
  const w=document.createElement('span');w.className='who';w.textContent=m.from==='you'?'TÚ':name;d.append(w,document.createTextNode(m.text));
  if(m.from==='you' && m.status){const r=document.createElement('span');r.className='small';r.style.display='block';r.style.textAlign='right';r.textContent=m.status;d.append(r)}
  box.append(d);
 });
 box.scrollTop=box.scrollHeight;updateMoodUI();
}

$('sendCharacterMessage')?.addEventListener('click',()=>{
 const name=$('chatCharacter').value,txt=$('characterMessage').value.trim();if(!txt)return;
 const hist=characterChats[name]||(characterChats[name]=[]),st=getCharacterState(name),persona=socialCast[name]||socialCast['Noob'];
 const low=txt.toLowerCase();
 const rude=/idiota|est[uú]pid[oa]|in[uú]til|c[aá]llate|te odio|basura|cobarde|pat[eé]tic[oa]|mierda|imb[eé]cil/.test(low);
 const threat=/te voy a matar|te destruir[eé]|te har[eé] da[nñ]o|te atrapar[eé]|amenaz|voy a acabar contigo/.test(low);
 const kind=/perd[oó]n|lo siento|gracias|conf[ií]o en ti|te ayudar[eé]|estoy contigo|¿est[aá]s bien|estas bien/.test(low);
 const help=/ayuda|ay[uú]dame|auxilio|miedo|asustad|peligro|herid/.test(low);
 if(rude){st.anger=Math.min(8,st.anger+2);st.trust=Math.max(0,st.trust-1)}
 if(threat){st.anger=Math.min(8,st.anger+2);st.fear=Math.min(8,st.fear+2);st.trust=Math.max(0,st.trust-2)}
 if(kind){st.anger=Math.max(0,st.anger-1);st.trust=Math.min(8,st.trust+1);st.fear=Math.max(0,st.fear-1)}
 if(help){if(persona.role!=='killer'){st.fear=Math.min(8,st.fear+1);if(kind)st.trust=Math.min(8,st.trust+1)}else st.anger=Math.min(8,st.anger+1)}
 let answer='';
 const noReply=(st.anger>=6 && (rude||threat)) || (st.anger>=7 && !kind);
 const fearReply=st.fear>=5 && !kind;
 if(noReply){
   hist.push({from:'you',text:txt,status:'✓✓ Visto · No responde'});
 } else {
   if(st.anger>=5){
    answer=persona.role==='killer'
      ? (name==='c00lkidd'?'«JAJA… ¿ahora te molesta que te trate como mereces?»':name==='Noli'?'«Qué reacción tan fácil de provocar. Gracias por confirmarlo.»':'«No vuelvas a dirigirte a mí como si tuvieras autoridad.»')
      : (name==='Shedletsky'?'«Se acabó mi paciencia. Aléjate.»':name==='007n7'?'«No vuelvas a escribirme hasta que tengas algo útil que decir.»':`«Estoy enfadado/a contigo. No esperes que te ayude ahora.»`);
   } else if(fearReply){
    answer=persona.role==='killer'
      ? (name==='Slasher'?'«…»':`«No te acerques. No sé qué vas a hacer.»`)
      : (name==='Noob'?'«E-espera… ¿por qué dices eso? No me gusta nada.»':`«No sé si puedo confiar en ti ahora mismo. Dame un momento.»`);
   } else if(help && persona.role!=='killer'){
    answer=({Noob:'«Estoy asustado, pero… gracias por preguntar. ¿Puedes quedarte cerca?»',Elliot:'«Estoy bien por ahora. Gracias por preocuparte. Sigamos con cuidado.»','Guest 1337':'«Estoy operativo. Mantén la posición y vigila la entrada.»',Jane:'«Puedo manejarlo. Aun así, agradezco que preguntes.»'})[name] || socialChoice(name,hist.length+txt.length,txt);
   } else answer=socialChoice(name,hist.length+txt.length,txt);
   if(st.trust>=4 && !rude && !threat) answer+=' Te estoy empezando a tomar en serio, pero no significa que confíe ciegamente en ti.';
   hist.push({from:'you',text:txt,status:'✓✓ Visto'});
   hist.push({from:'character',text:answer});
 }
 st.lastMood=moodLabel(st);
 characterChats[name]=hist.slice(-60);characterStates[name]=st;
 try{localStorage.setItem('forsaken_character_chats',JSON.stringify(characterChats));localStorage.setItem('forsaken_character_states',JSON.stringify(characterStates))}catch(e){}
 $('characterMessage').value='';renderCharacterChat();
});

let spontaneousTimer=null;
let incomingSeen={};
try{incomingSeen=JSON.parse(localStorage.getItem('forsaken_incoming_seen')||'{}')}catch(e){incomingSeen={}}
function saveIncomingSeen(){try{localStorage.setItem('forsaken_incoming_seen',JSON.stringify(incomingSeen))}catch(e){}}
function incomingTemplates(name){
 const st=getCharacterState(name),role=(socialCast[name]||{}).role;
 if(st.anger>=5){
  if(role==='killer')return [['No te confundas. No he terminado contigo.','Y deja de ignorar lo que te dije.'],['No vuelvas a escribirme como si fuéramos aliados.','No estoy de humor para tus excusas.']];
  return [['Sigo enfadado contigo.','No esperes que te responda enseguida.'],['Leí lo que dijiste. No significa que te haya perdonado.','Necesito espacio.']];
 }
 if(st.fear>=5 && role!=='killer'){
  return [['¿Sigues ahí?','No me gusta estar a solas en este sitio.','Creo que acabo de oír algo en el pasillo.'],['No sé si debería contarte esto…','Vi una sombra cerca de la entrada.','Por favor, dime que tú también estás pendiente.']];
 }
 const packs={
  'Noob':[['Hola…','¿Qué haces?','Esto está demasiado callado, ¿no?','Hace rato que no veo al killer. No creo que sea coincidencia.'],['Oye, ¿sigues ahí?','Encontré una puerta abierta.','No recuerdo que estuviera así antes.']],
  'Elliot':[['¿Estás bien?','No he visto a los demás desde hace un rato.','Voy a revisar el pasillo. Te aviso si encuentro algo.'],['Necesito confirmar algo contigo.','¿Viste quién pasó por la cocina?','No quiero sacar conclusiones precipitadas.']],
  'Shedletsky':[['¿Dónde te metiste?','No me gusta que el grupo se disperse.','Si ves al killer, no intentes hacerte el héroe.'],['Tengo una mala sensación.','No es miedo. Solo estoy prestando atención.']],
  'Guest 1337':[['Reporte de situación: silencio inusual.','No he detectado al asesino.','Mantente cerca de una ruta de salida.'],['¿Sigues en tu puesto?','Responde cuando puedas. No te alejes sin avisar.']],
  '007n7':[['¿Sigues conectado?','He revisado los registros. Hay un intervalo que no cuadra.','No te fíes de las cámaras.'],['Tengo una teoría.','No te la voy a explicar por mensajes.','Mira si alguien ha cambiado de sitio.']],
  'Two Time':[['¿Cuánto tiempo llevas sin mirar el reloj?','Aquí el tiempo se siente extraño.','Avísame si escuchas dos golpes seguidos.'],['Estaba pensando en lo que pasó antes.','No estoy seguro de que haya terminado.']],
  'Chance':[['¿Apostamos a que el killer está cerca?','…Era broma. Más o menos.','¿Por qué nadie contesta?'],['Tengo una idea arriesgada.','Eso normalmente significa que va a salir mal.']],
  'Builderman':[['Estoy revisando las puertas.','Una de las rutas no coincide con el plano.','No uses la escalera del este hasta que lo confirme.'],['¿Encontraste herramientas?','Podrían servir para bloquear la entrada.']],
  'Taph':[['Acabo de revisar una foto.','Hay una silueta al fondo que no recuerdo haber visto.','Voy a comparar las otras imágenes.'],['¿Puedes comprobar si la luz del pasillo sigue encendida?','La cámara captó un parpadeo raro.']],
  'Dusekkar':[['La atmósfera ha cambiado.','No siento que estemos solos.','Si escuchas una voz familiar, verifica de dónde viene.'],['Hay algo fuera de lugar.','Todavía no sé qué significa.']],
  'Jane Doe':[['Necesito preguntarte algo.','¿Quién tuvo acceso a la puerta del sótano?','No me digas que no lo sabes si no lo has comprobado.'],['Encontré un registro alterado.','Alguien estuvo aquí antes que nosotros.']],
  'Veeronica':[['¿Hola? ¿Por qué está todo el mundo tan callado?','No me gusta nada este silencio.','Si sabes algo, dilo ya.'],['Acabo de oír pasos.','Si era una broma, no tiene gracia.']],
  'c00lkidd':[['HEYYY.','¿Ya me extrañabas? JAJA.','Nah, mentira. Solo quería ver si seguías ahí.'],['¿A que no adivinas dónde estoy?','Pista: no estás mirando en la dirección correcta.','¡JAJAJA!']],
  'Slasher':[['Te encontré en línea.','No te relajes.','Todavía estoy cerca.'],['…','Sigo aquí.','Corre cuando puedas.']],
  'John Doe':[['CONEXIÓN DETECTADA.','USUARIO ACTIVO.','NO SE HA ENCONTRADO UNA SALIDA SEGURA.'],['El registro ha cambiado.','No preguntes quién lo modificó.']],
  'Noli':[['¿Me echabas de menos?','Qué silencio tan incómodo.','Podría arreglarlo… o empeorarlo.'],['Dime, ¿estás seguro de que recuerdas bien el último pasillo?','Qué curioso. Yo lo recuerdo distinto.']],
  '1x1x1x1':[['SEÑAL CORRUPTA.','NO CONFÍES EN EL MAPA.','PROPAGACIÓN EN CURSO.'],['Tu sistema sigue respondiendo.','Por ahora.']],
  'Guest 666':[['Te oigo.','No te escondas demasiado lejos.','La ronda sigue.'],['Silencio.','Eso no te salvará.']],
  'Nosferatu':[['La noche se ha vuelto tranquila. Demasiado tranquila.','¿No deberías estar vigilando la puerta?'],['Una presencia se mueve por el corredor.','No te aconsejo seguirla.']],
  'Azure':[['Estado del mapa actualizado.','Tu ruta más cercana ya no es segura.','Encuentra otra salida.'],['No te distraigas.','El peligro no avisa dos veces.']],
  'Spectre':[['Estoy observando.','El silencio también es información.','No creas que una conversación debe comenzar contigo.']]
 };
 return packs[name]||[['¿Sigues ahí?','No me gusta este silencio.'],['Necesito decirte algo.','Respóndeme cuando puedas.']];
}
function renderInbox(){
 const box=$('incomingInbox');if(!box)return;box.innerHTML='';
 const filter=$('inboxFilter')?.value||'all';
 let messages=[];
 Object.keys(characterChats).forEach(name=>(characterChats[name]||[]).forEach((m,i)=>{if(m.from==='character' && m.spontaneous)messages.push({...m,character:name,index:i})}));
 messages=messages.filter(m=>filter==='all'||m.character===filter).sort((a,b)=>(b.time||0)-(a.time||0)).slice(0,20);
 if(!messages.length){box.innerHTML='<div class="notice">Aún no tienes mensajes espontáneos. Déjalos activados y los personajes podrán escribirte primero.</div>';return}
 messages.forEach(m=>{
  const b=document.createElement('button');b.style.cssText='text-align:left;white-space:normal;display:block';
  b.innerHTML='';
  const strong=document.createElement('strong');strong.textContent=`${socialCast[m.character]?.emoji||'💬'} ${m.character}`;
  const msg=document.createElement('div');msg.textContent=m.text;
  const small=document.createElement('span');small.className='small';small.textContent=m.timeLabel||'Mensaje nuevo';
  b.append(strong,msg,small);b.addEventListener('click',()=>{$('chatCharacter').value=m.character;renderCharacterChat()});box.append(b);
 });
}
function spontaneousBurst(force=false){
 const candidates=socialNames.filter(n=>n!=='Spectre');
 // Favor the currently selected chat less often, so other characters can initiate too.
 const name=candidates[Math.floor(Math.random()*candidates.length)];
 const hist=characterChats[name]||(characterChats[name]=[]);
 const packList=incomingTemplates(name);
 const pack=packList[Math.floor(Math.random()*packList.length)];
 const now=Date.now();
 if(!force && now-(incomingSeen[name]||0)<45000)return;
 incomingSeen[name]=now;saveIncomingSeen();
 pack.forEach((line,i)=>{
  hist.push({from:'character',text:line,spontaneous:true,time:now+i,timeLabel:new Date(now+i).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})});
 });
 characterChats[name]=hist.slice(-60);
 try{localStorage.setItem('forsaken_character_chats',JSON.stringify(characterChats))}catch(e){}
 renderInbox();
 if($('chatCharacter')?.value===name)renderCharacterChat();
 const status=$('spontaneousStatus');
 if(status)status.textContent=`Nuevo mensaje de ${name}. Ha enviado ${pack.length} mensajes seguidos.`;
}
function setSpontaneous(on){
 spontaneousEnabled=on;
 const btn=$('toggleSpontaneous');if(btn)btn.textContent=on?'Desactivar mensajes espontáneos':'Activar mensajes espontáneos';
 const status=$('spontaneousStatus');if(status)status.textContent=on?'Mensajes espontáneos activados. Los personajes pueden escribirte aunque no abras su chat. La página debe permanecer abierta.':'Los mensajes espontáneos están desactivados. Puedes activarlos para recibir mensajes aunque no escribas primero.';
 if(spontaneousTimer){clearInterval(spontaneousTimer);spontaneousTimer=null}
 if(on){
  spontaneousTimer=setInterval(()=>{if(Math.random()<0.72)spontaneousBurst(false)},18000);
 }
}
$('toggleSpontaneous')?.addEventListener('click',()=>setSpontaneous(!spontaneousEnabled));
$('receiveNow')?.addEventListener('click',()=>spontaneousBurst(true));
$('inboxFilter')?.addEventListener('change',renderInbox);
$('chatCharacter')?.addEventListener('change',()=>{renderInbox()});
function renderLoot(){
 const list=$('lootList'),inv=$('inventoryItems');if(!list||!inv)return;
 list.innerHTML='';inv.innerHTML='';
 const map=$('lootMap').value;
 const found=lootCatalog.filter((it,i)=>((i+map.length)%3)!==1);
 found.forEach(item=>{
  const row=document.createElement('div');row.className='storyitem';
  const info=document.createElement('div');info.style.flex='1';const strong=document.createElement('strong');strong.textContent=`${item.emoji} ${item.name}`;
  const desc=document.createElement('div');desc.className='small';desc.textContent=item.desc;info.append(strong,desc);
  const btn=document.createElement('button');const owned=playerInventory.some(x=>x.id===item.id);
  btn.textContent=owned?'Recogido':'Recoger';btn.disabled=owned;
  btn.addEventListener('click',()=>collectLoot(item,map));row.append(info,btn);list.append(row);
 });
 $('inventoryCount').textContent=`${playerInventory.length} objeto${playerInventory.length===1?'':'s'}`;
 if(!playerInventory.length){inv.innerHTML='<div class="notice">Todavía no has recogido nada. Busca objetos en el escenario.</div>';$('inventoryEffect').textContent='Todavía no has recogido nada.'}
 else playerInventory.forEach(item=>{
  const row=document.createElement('div');row.className='storyitem';
  const info=document.createElement('div');const strong=document.createElement('strong');strong.textContent=`${item.emoji} ${item.name}`;
  const desc=document.createElement('div');desc.className='small';desc.textContent=`Encontrado en ${item.map}. ${item.desc}`;info.append(strong,desc);
  const btn=document.createElement('button');btn.textContent='Examinar';btn.addEventListener('click',()=>{$('inventoryEffect').textContent=`${item.emoji} ${item.name}: ${item.desc}`});row.append(info,btn);inv.append(row);
 });
}
function collectLoot(item,map){
 if(playerInventory.some(x=>x.id===item.id))return;
 playerInventory.push({...item,map,foundAt:new Date().toLocaleString()});saveInventory();renderLoot();
 $('inventoryEffect').textContent=`Recogiste ${item.emoji} ${item.name}. Se añadió automáticamente a tu inventario.`;
 if(typeof roundLog==='function')roundLog('Inventario',`Objeto recogido: ${item.name} en ${map}.`);
}
$('lootMap')?.addEventListener('change',renderLoot);
$('searchLoot')?.addEventListener('click',()=>{
 const available=lootCatalog.filter(it=>!playerInventory.some(x=>x.id===it.id));
 if(!available.length){$('inventoryEffect').textContent='Ya encontraste todos los objetos de esta colección.';return}
 const map=$('lootMap').value;
 const item=available[Math.floor(Math.random()*available.length)];
 collectLoot(item,map);
});
$('resetInventory')?.addEventListener('click',()=>{playerInventory=[];saveInventory();renderLoot();$('inventoryEffect').textContent='Inventario vacío.'});
renderLoot();
$('inboxFilter').innerHTML='<option value="all">Todos los personajes</option>'+socialNames.map(n=>`<option value="${n}">${n}</option>`).join('');
renderInbox();
socialLoad();renderFeed();refreshSpectre();

</script>

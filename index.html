<!DOCTYPE html>
<html lang="es">
<head>

<title>Abandonado: Tu Propio Caos</title>
<style>
:root{--bg:#0b0b12;--panel:#151520;--panel2:#1c1c2a;--line:#303044;--text:#f3f2fa;--muted:#aaa9c0;--red:#ff365f;--purple:#9b6dff;--green:#7df0bb}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#211329 0,#0b0b12 48%);color:var(--text);font:15px/1.45 system-ui,sans-serif;min-height:100vh}
button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:12px;padding:11px 14px;font-weight:700}button:hover{border-color:var(--purple)}button.primary{background:linear-gradient(110deg,#ff365f,#a34bff);border:0}
header{padding:22px 16px 8px;text-align:center}.eyebrow{font-size:10px;letter-spacing:2px;color:var(--muted);font-weight:800}h1{margin:8px 0;font-size:28px;line-height:.9}h1 span{color:var(--red)}.subtitle{color:var(--muted);margin:0 auto;max-width:520px}
nav.tabs{display:flex;gap:8px;overflow:auto;padding:12px 16px;position:sticky;top:0;background:#0b0b12e6;backdrop-filter:blur(8px);z-index:2;border-bottom:1px solid var(--line)}
main{padding:16px;max-width:1100px;margin:0 auto}.view{display:none}.view.active{display:block}.grid{display:grid;grid-template-columns:1fr;gap:13px}.card{background:linear-gradient(145deg,rgba(25,25,39,.97),rgba(17,17,27,.97));border:1px solid var(--line);border-radius:18px;padding:16px}
.card h2{margin:0 0 12px;font-size:19px}.muted{color:var(--muted)}.small
